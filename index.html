<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/index.css" />
    <title>Document</title>
  </head>
  <body>
    <!--Step 4: Modal with form for inputting book information / A button should open the form-->

    <!--Modal dialog -->
    <!--Note: Submit is closing the modal because is RELOADING the page to submit the info. so, it is not really closing the modal-->
    <div>
      <button command="show-modal" commandfor="my-dialog">New Book</button>

      <dialog id="my-dialog">
        <p>This dialog was opened using an invoker command.</p>

        <form action="" method="dialog" id="myForm">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" />

          <label for="author">Author</label>
          <input type="text" id="author" name="author" />

          <label for="isbn">ISBN</label>
          <input type="number" id="isbn" name="isbn" />

          <label for="pages">Page count</label>
          <input type="number" id="pages" name="pages" />

          <label for="Status">Status</label>
          <input type="text" id="status" name="status" />

          <button type="submit">Submit</button>
        </form>

        <button commandfor="my-dialog" command="close">Close</button>
      </dialog>
    </div>

    <!--Non-modal dialog
    <div>
      <button popovertarget="my-dialog">Open dialog</button>
      <dialog id="my-dialog" popover>
        <p>This dialog was opened using a popovertargetaction attribute.</p>
        <button popovertarget="my-dialog" popovertargetaction="hide">
          Close
        </button>
      </dialog>
    </div>
    -->

    <!--Step 5: Gathering the info from the inputs on the form
    That’s because the submit input tries to send the data to a server by default. This is where event.preventDefault(); will come in handy. 
    Check out the documentation for event.preventDefault and see how you can solve this issue!
    
    -->

    <script src="/index.js"></script>
  </body>
</html>
