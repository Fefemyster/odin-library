<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/index.css" />
    <title>Document</title>
  </head>
  <body>
    <div><button class="newBookButton">New Book</button></div>

    <!--Step 4: Modal with form for inputting book information / A button should open the form-->
    <div>
      <form action="">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" />

        <label for="author">Author</label>
        <input type="text" id="author" name="author" />

        <label for="isbn">ISBN</label>
        <input type="number" id="isbn" name="isbn" />

        <label for="pages">Page count</label>
        <input type="number" id="pages" name="pages" />

        <button type="submit">Submit</button>
      </form>
    </div>

    <!--Modal dialog
    <div>
      <button command="show-modal" commandfor="my-dialog">Open dialog</button>
      <dialog id="my-dialog">
        <p>This dialog was opened using an invoker command.</p>
        <button commandfor="my-dialog" command="close">Close</button>
      </dialog>
    </div>
    

    -->

    <!--Non-modal dialog-->
    <div>
      <button popovertarget="my-dialog">Open dialog</button>
      <dialog id="my-dialog" popover>
        <p>This dialog was opened using a popovertargetaction attribute.</p>
        <button popovertarget="my-dialog" popovertargetaction="hide">
          Close
        </button>
      </dialog>
    </div>

    <script src="/index.js"></script>
  </body>
</html>
